spring.application.name=SafeExchange

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/SafeExchange
spring.datasource.username=postgres
spring.datasource.password=root

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (placeholder - fine for local dev, don't use this in production)
app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY_MIN_256_BITS
app.jwt.expiration-ms=86400000