spring.application.name=SafeExchange

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/SafeExchange
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (placeholder - fine for local dev, don't use this in production)
app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY_MIN_256_BITS
app.jwt.expiration-ms=86400000



# Gmail SMTP (for OTP emails)
# 1. Enable 2-Step Verification: https://myaccount.google.com/security
# 2. Generate an "App Password": https://myaccount.google.com/apppasswords
# 3. Paste the 16-character app password below (NOT your normal Gmail password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Razorpay Test Mode
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}